<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Valentine ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(to bottom, #ff4d6d, #ff758f);
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
  }

  /* Message Box */
  .box {
    width: 85%;
    max-width: 900px;
    background: #f6c1c8;
    margin-top: 60px;
    padding: 60px 40px;
    text-align: center;
    border-radius: 4px;
  }

  .box h1 {
    color: white;
    font-size: 32px;
    line-height: 1.6;
    font-weight: bold;
  }

  /* Image Section */
  .image-container {
    margin: 40px 0 80px;
    width: 85%;
    max-width: 900px;
  }

  .image-container img {
    width: 100%;
    display: block;
  }

  /* Confetti */
  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 8px;
    animation: fall linear infinite;
  }

  @keyframes fall {
    from {
      transform: translateY(-10vh) rotate(0deg);
    }
    to {
      transform: translateY(110vh) rotate(360deg);
    }
  }
</style>
</head>

<body>

<div class="box">
  <h1>
    ❤️ Yahooooo! ❤️ <br>
    I’m grateful for you every day—for your love, your smile,
    and the way you make my life feel complete.💖
  </h1>
</div>

<div class="image-container">
  <img src="aaa.gif" alt="Celebration">
</div>

<audio autoplay>
  <source src="https://prodigits.co.uk/pcontent/mp3tones/tone/2020/bollywood/preview/c9c71a405025495.mp3" type="audio/mp3">
</audio>

<script>
  setInterval(() => {
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.background =
      `hsl(${Math.random() * 360}, 100%, 70%)`;
    confetti.style.animationDuration =
      Math.random() * 3 + 2 + "s";

    document.body.appendChild(confetti);

    setTimeout(() => {
      confetti.remove();
    }, 5000);
  }, 150);
</script>

</body>
</html>
